<section class="gallery section" id="gallery" data-gallery>
  <div class="wrap">
    <header class="section__head">
      <p class="eyebrow" data-split-fade>Gallery</p>
      <h2 class="display" data-split>{{GALLERY_HEADING}}</h2>
    </header>
  </div>

  <div class="wrap collage {{COLLAGE_CLASS}}">
    {{HAIR_FIGURE}}
    <a class="g g--ig" href="{{INSTAGRAM}}" target="_blank" rel="noopener noreferrer" data-fade data-layer="0.8">
      <span class="g__ig-label">See the latest work on Instagram</span>
      <span class="g__ig-handle">{{INSTAGRAM_HANDLE}}</span>
      <span class="g__ig-arrow" aria-hidden="true">&rarr;</span>
    </a>
  </div>
</section>

<section class="statement section section--ink" data-statement>
  <div class="wrap">
    <p class="statement__text" data-statement-text>Every look begins with a conversation, and ends with you feeling like yourself.</p>
  </div>
</section>
