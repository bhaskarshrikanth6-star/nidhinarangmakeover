<section class="contact section section--ink" id="contact" data-contact>
  <div class="wrap contact__grid">
    <div class="contact__lead">
      <p class="eyebrow" data-split-fade>Contact</p>
      <h2 class="display display--xl" data-split>Let's plan your look.</h2>
      <p class="lede" data-lines>Message or call to book an appointment, ask about bridal dates or enquire about home service.</p>
      <a class="orb" data-magnetic href="https://wa.me/{{WHATSAPP_NUMBER}}?text={{WHATSAPP_TEXT_ENC}}" target="_blank" rel="noopener noreferrer" data-fade>
        <span>Book on<br>WhatsApp</span>
      </a>
    </div>

    <ul class="contact__actions">
      <li data-contact-item>
        <a class="contact__item" href="tel:{{PHONE_TEL}}">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2a1 1 0 0 1 1-.25 11.4 11.4 0 0 0 3.6.57 1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.25.2 2.45.57 3.6a1 1 0 0 1-.25 1z"/></svg>
          <span class="contact__label">Call</span>
          <span class="contact__value">{{PHONE_DISPLAY}}</span>
        </a>
      </li>
      <li data-contact-item>
        <a class="contact__item" href="https://wa.me/{{WHATSAPP_NUMBER}}?text={{WHATSAPP_TEXT_ENC}}" target="_blank" rel="noopener noreferrer">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm0 18.2a8.2 8.2 0 0 1-4.2-1.15l-.3-.18-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2zm4.5-6.1c-.25-.12-1.45-.72-1.7-.8-.22-.08-.4-.12-.56.12-.17.25-.65.8-.8.97-.14.17-.3.18-.54.06a6.7 6.7 0 0 1-3.3-2.9c-.25-.43.25-.4.72-1.34.08-.17.04-.3-.02-.42-.06-.12-.56-1.35-.77-1.85-.2-.48-.4-.42-.56-.43h-.48c-.17 0-.43.06-.66.3-.22.25-.86.84-.86 2.05s.88 2.38 1 2.55c.12.17 1.73 2.64 4.2 3.7 1.5.65 2.1.7 2.85.6.45-.07 1.45-.6 1.65-1.17.2-.57.2-1.06.14-1.17-.06-.1-.22-.17-.47-.3z"/></svg>
          <span class="contact__label">WhatsApp</span>
          <span class="contact__value">{{PHONE_DISPLAY}}</span>
        </a>
      </li>
      <li data-contact-item>
        <a class="contact__item" href="{{INSTAGRAM}}" target="_blank" rel="noopener noreferrer">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7.5 2h9A5.5 5.5 0 0 1 22 7.5v9a5.5 5.5 0 0 1-5.5 5.5h-9A5.5 5.5 0 0 1 2 16.5v-9A5.5 5.5 0 0 1 7.5 2zm0 1.8A3.7 3.7 0 0 0 3.8 7.5v9a3.7 3.7 0 0 0 3.7 3.7h9a3.7 3.7 0 0 0 3.7-3.7v-9a3.7 3.7 0 0 0-3.7-3.7zM12 7a5 5 0 1 1 0 10 5 5 0 0 1 0-10zm0 1.8a3.2 3.2 0 1 0 0 6.4 3.2 3.2 0 0 0 0-6.4zM17.4 5.6a1.2 1.2 0 1 1 0 2.4 1.2 1.2 0 0 1 0-2.4z"/></svg>
          <span class="contact__label">Instagram</span>
          <span class="contact__value">{{INSTAGRAM_HANDLE}}</span>
        </a>
      </li>
      <li data-contact-item>
        <a class="contact__item" href="{{DIRECTIONS}}" target="_blank" rel="noopener noreferrer">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a7 7 0 0 0-7 7c0 5.2 7 13 7 13s7-7.8 7-13a7 7 0 0 0-7-7zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5z"/></svg>
          <span class="contact__label">Get Directions</span>
          <span class="contact__value">{{ADDRESS}}</span>
        </a>
      </li>
    </ul>
  </div>
</section>
