<footer class="footer">
  <div class="wrap footer__grid">
    <div class="footer__brand" data-footer-part>
      {{LOGO variant="clear" sizes="(max-width: 700px) 60vw, 200px" class="logo" alt="Nidhi Narang Makeover logo" loading="lazy"}}
    </div>
    <address class="footer__col" data-footer-part>
      <p class="footer__h">Visit</p>
      <p>{{ADDRESS}}</p>
      <p>Home service available</p>
      <a href="{{DIRECTIONS}}" target="_blank" rel="noopener noreferrer">Get Directions</a>
    </address>
    <div class="footer__col" data-footer-part>
      <p class="footer__h">Connect</p>
      <a href="tel:{{PHONE_TEL}}">{{PHONE_DISPLAY}}</a>
      <a href="https://wa.me/{{WHATSAPP_NUMBER}}?text={{WHATSAPP_TEXT_ENC}}" target="_blank" rel="noopener noreferrer">WhatsApp</a>
      <a href="{{INSTAGRAM}}" target="_blank" rel="noopener noreferrer">Instagram</a>
    </div>
  </div>
  <p class="footer__legal wrap" data-footer-part>&copy; <span data-year>2026</span> {{BRAND}}. All rights reserved.</p>
</footer>
